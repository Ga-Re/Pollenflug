name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin

  syntax:
    name: JavaScript-Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check pollenflug-card.js
